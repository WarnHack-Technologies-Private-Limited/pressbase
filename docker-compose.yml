# Development database. Start it with: pnpm db:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pressbase
      POSTGRES_PASSWORD: pressbase
      POSTGRES_DB: pressbase
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pressbase"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
