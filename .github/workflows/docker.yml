name: Docker

# Pull requests: build the image for amd64, start it and check the installer
# answers. Release tags (v*): build for amd64 and arm64 and push to GHCR.
on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/warnhack-technologies-private-limited/pressbase

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pressbase:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and wait until it's healthy
        run: |
          docker run -d --name pressbase -p 3000:3000 -v pressbase-data:/data pressbase:test
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' pressbase)
            [ "$status" = healthy ] && break
            [ "$(docker inspect --format '{{.State.Running}}' pressbase)" = true ] || break
            sleep 3
          done
          docker logs pressbase
          test "$(docker inspect --format '{{.State.Health.Status}}' pressbase)" = healthy
      - name: The installer and the public site answer
        run: |
          curl -fsS http://localhost:3000/install | grep -q 'Welcome to Pressbase'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 302
          curl -fsS http://localhost:3000/wp-json/pressbase/v1/install | grep -q '"needs-database"'
      - name: Stops cleanly on SIGTERM
        run: |
          docker stop --time 20 pressbase
          test "$(docker inspect --format '{{.State.ExitCode}}' pressbase)" = 0

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 → 1.2.3, 1.2 and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
