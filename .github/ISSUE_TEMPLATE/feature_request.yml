name: Feature request
description: Suggest an idea or a WordPress feature Pressbase should support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: input
    id: wordpress
    attributes:
      label: WordPress equivalent (if any)
      placeholder: e.g. register_post_type(), Settings → Reading
